name: Benchmark runnable
description: Check if a user is allowed to execute benchmark
inputs:
  username:
    description: Username to check
    required: true
  allowed-users-file:
    description: >
      Path, relative to the workspace, of the file listing usernames allowed to run benchmark.
      One username per line; blank lines and lines starting with '#' are ignored.
      Matching is case-insensitive.
      The containing repository must be checked out before this action runs.
    required: false
    default: .github/benchmark-allowed-users.txt
outputs:
  authorized:
    description: If the user is a member of the benchmarkable
    value: ${{ steps.check-benchmarkable.outputs.is-member }}

runs:
  using: "composite"
  steps:
    - name: Check member is benchmarkable
      id: check-benchmarkable
      shell: bash
      run: |
        users_file="${GITHUB_WORKSPACE}/${ALLOWED_USERS_FILE}"
        if [[ ! -f "${users_file}" ]]; then
          # Fail closed: a missing allowlist must never grant access.
          echo "::warning::Benchmark allowlist not found at ${ALLOWED_USERS_FILE}. Check out the repository before this action or set allowed-users-file. Denying."
          echo "is-member=false" | tee -a "$GITHUB_OUTPUT"
          exit 0
        fi

        normalized="$(printf '%s' "${USERNAME}" | tr '[:upper:]' '[:lower:]')"
        while IFS= read -r line || [[ -n "${line}" ]]; do
          line="$(printf '%s' "${line}" | tr -d '[:space:]')"
          [[ -z "${line}" || "${line}" == '#'* ]] && continue
          if [[ "$(printf '%s' "${line}" | tr '[:upper:]' '[:lower:]')" == "${normalized}" ]]; then
            echo "User is a benchmarkable."
            echo "is-member=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
        done < "${users_file}"

        echo "User is not benchmarkable."
        echo "is-member=false" | tee -a "$GITHUB_OUTPUT"
      env:
        ALLOWED_USERS_FILE: ${{ inputs.allowed-users-file }}
        USERNAME: ${{ inputs.username }}
